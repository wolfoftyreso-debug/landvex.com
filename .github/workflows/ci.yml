name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the Dockerfile, so CI and the production image agree.
      # The test script needs --experimental-strip-types, which lands in 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Last: the slowest step, and the one the earlier three explain when it
      # fails. Build with the production flags the image uses.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
